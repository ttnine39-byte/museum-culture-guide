<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아트하트❤️ - 서울 전시, 문화 정보</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 1. 헤더: 서브타이틀 + 중앙 아트하트❤️ */
    header {
      text-align: center;
      padding: 10px 0 20px 0;
      border-bottom: 1px solid #333333;
      margin-bottom: 20px;
    }

    .header-subtitle {
      font-size: 0.9rem;
      color: #aaaaaa;
      margin-bottom: 4px;
    }

    .logo-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* 필터 및 검색 바 */
    .filter-card {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .filter-input, .filter-select {
      background-color: #121212;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .filter-input {
      flex: 1;
    }

    /* 2. 장르 탭 (기타 문화 탭 포함) */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      background-color: #1e1e1e;
      color: #888888;
      border: 1px solid #333333;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .tab-btn.active, .tab-btn:hover {
      background-color: #ff6b81;
      color: #ffffff;
      border-color: #ff6b81;
    }

    /* 3. 메인 화면 2열 레이아웃 (왼쪽: 리스트, 오른쪽: 지도) */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 650px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* 왼쪽: 전시 정보 리스트 영역 */
    .event-list-container {
      max-height: 750px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }

    .event-card:hover {
      border-color: #ff6b81;
      transform: translateY(-2px);
    }

    .badge-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .badge-art { background-color: #ff6b81; color: #fff; }
    .badge-music { background-color: #3f51b5; color: #fff; }
    .badge-theater { background-color: #9c27b0; color: #fff; }
    .badge-etc { background-color: #555555; color: #fff; }

    .facility-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .event-title {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .event-date {
      font-size: 0.8rem;
      color: #888888;
    }

    /* 오른쪽: 크게 들어가는 지도 영역 */
    .map-section {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 20px;
      height: 750px;
    }

    .map-header {
      padding: 12px 16px;
      background-color: #252525;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 1px solid #333333;
      color: #ff8fa3;
    }

    .map-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      color: #888888;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <header>
      <div class="header-subtitle">서울 전시, 문화 정보</div>
      <h1 class="logo-title">아트하트❤️</h1>
    </header>

    <!-- 검색 및 필터 -->
    <div class="filter-card">
      <input type="text" id="search-input" class="filter-input" placeholder="전시장/공연명 검색..." oninput="applyFilters()">
    </div>

    <!-- 2. 장르 탭 (기타 문화 포함) -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="setTab('전체', this)">전체보기</button>
      <button class="tab-btn" onclick="setTab('미술', this)">🎨 미술/전시</button>
      <button class="tab-btn" onclick="setTab('음악', this)">🎼 음악/연주회</button>
      <button class="tab-btn" onclick="setTab('연극', this)">🎭 연극/뮤지컬</button>
      <button class="tab-btn" onclick="setTab('기타 문화', this)">🏛️ 기타 문화</button>
    </div>

    <!-- 3. 메인 2열 레이아웃 (왼쪽: 리스트 / 오른쪽: 지도) -->
    <div class="main-content">
      <!-- 왼쪽 전시 정보 리스트 -->
      <div class="event-list-container">
        <div id="event-list" class="event-list">
          <div class="loading">KOPIS 데이터를 불러오는 중입니다...</div>
        </div>
      </div>

      <!-- 오른쪽 지도 영역 -->
      <div class="map-section">
        <div id="map-header" class="map-header">🗺️ 지도 위치 보기 (목록을 선택하세요)</div>
        <iframe id="map-frame" class="map-frame" src="https://maps.google.com/maps?q=서울 미술관&t=&z=12&ie=UTF8&iwloc=&output=embed"></iframe>
      </div>
    </div>
  </div>

  <script>
    const KOPIS_API_KEY = "4650ca9b3cd14d5eb489f753faf9d070";

    let fetchedEvents = [];
    let activeTab = "전체";

    /**
     * API 호출 (실제 데이터만 로드)
     */
    async function fetchApiData() {
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const targetUrl = `https://www.kopis.or.kr/openApi/rest/pblprfr?service=${KOPIS_API_KEY}&stdate=${today}&eddate=20261231&cpage=1&rows=100&prfstate=02`;

      try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
        
        if (response.ok) {
          const data = await response.json();
          if (data.contents) {
            parseXmlData(data.contents);
            return;
          }
        }
        throw new Error("데이터 수신 오류");
      } catch (err) {
        document.getElementById("event-list").innerHTML = 
          `<div class="loading">API 데이터를 불러오는 중 통신 오류가 발생했습니다.<br>잠시 후 다시 시도해 주세요.</div>`;
      }
    }

    /**
     * XML 데이터 파싱 및 장르 분류 (2. 분류 불가 시 기타 문화 처리)
     */
    function parseXmlData(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const items = Array.from(xmlDoc.getElementsByTagName("db"));

      fetchedEvents = items.map(item => {
        const rawGenre = item.getElementsByTagName("genrenm")[0]?.textContent || "";
        
        return {
          id: item.getElementsByTagName("mt20")[0]?.textContent || "",
          title: item.getElementsByTagName("prfnm")[0]?.textContent || "",
          facility: item.getElementsByTagName("fcltynm")[0]?.textContent || "",
          genre: categorizeGenre(rawGenre),
          rawGenre: rawGenre,
          startDate: item.getElementsByTagName("prfpdfrom")[0]?.textContent || "",
          endDate: item.getElementsByTagName("prfpdto")[0]?.textContent || ""
        };
      });

      applyFilters();
    }

    /**
     * 장르 분류 함수 (미술, 음악, 연극 이외에는 '기타 문화'로 분류)
     */
    function categorizeGenre(genreStr) {
      if (genreStr.includes("미술") || genreStr.includes("전시")) return "미술";
      if (genreStr.includes("음악") || genreStr.includes("국악") || genreStr.includes("클래식")) return "음악";
      if (genreStr.includes("연극") || genreStr.includes("뮤지컬") || genreStr.includes("무용")) return "연극";
      return "기타 문화"; // 2. 분류 안되는 항목 처리
    }

    /**
     * 탭 선택 이벤트
     */
    function setTab(tabName, element) {
      activeTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      applyFilters();
    }

    /**
     * 필터 적용 및 화면 업데이트
     */
    function applyFilters() {
      const searchKeyword = document.getElementById("search-input").value.toLowerCase();

      const filtered = fetchedEvents.filter(item => {
        const matchesTab = (activeTab === "전체") || (item.genre === activeTab);
        const matchesSearch = item.title.toLowerCase().includes(searchKeyword) || 
                              item.facility.toLowerCase().includes(searchKeyword);
        return matchesTab && matchesSearch;
      });

      renderList(filtered);
    }

    /**
     * 3. 카드 클릭 시 오른쪽 지도 갱신 및 외부 검색 이동
     */
    function selectCard(facility, title) {
      // 지도 업데이트
      const mapFrame = document.getElementById("map-frame");
      const mapHeader = document.getElementById("map-header");
      
      mapHeader.innerText = `🗺️ ${facility} 위치`;
      mapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(facility)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;

      // 상세 연결
      const openSearch = confirm(`[${facility}]\n"${title}"\n\n상세 정보 및 검색 페이지로 이동하시겠습니까?`);
      if (openSearch) {
        window.open(`https://search.naver.com/search.naver?query=${encodeURIComponent(facility + " " + title)}`, '_blank');
      }
    }

    /**
     * 리스트 렌더링
     */
    function renderList(events) {
      const listContainer = document.getElementById("event-list");
      listContainer.innerHTML = "";

      if (events.length === 0) {
        listContainer.innerHTML = `<div class="loading">조회된 정보가 없습니다.</div>`;
        return;
      }

      events.forEach(item => {
        const card = document.createElement("div");
        card.className = "event-card";
        card.onclick = () => selectCard(item.facility, item.title);

        let badgeClass = "badge-art";
        if (item.genre === "음악") badgeClass = "badge-music";
        if (item.genre === "연극") badgeClass = "badge-theater";
        if (item.genre === "기타 문화") badgeClass = "badge-etc";

        card.innerHTML = `
          <div class="badge-group">
            <span class="badge ${badgeClass}">${item.genre}</span>
          </div>
          <h2 class="facility-name">${item.facility}</h2>
          <p class="event-title">${item.title}</p>
          <span class="event-date">🗓️ ${item.startDate} ~ ${item.endDate}</span>
        `;

        listContainer.appendChild(card);
      });
    }

    // 초기 데이터 수집 실행
    fetchApiData();
  </script>
</body>
</html>
