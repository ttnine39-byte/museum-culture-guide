<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 전시, 문화 정보 - 아트하트❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 1. 상단 타이틀: 서울 전시, 문화 정보 + 중앙 아트하트❤️ */
    header {
      text-align: center;
      padding: 20px 0 30px 0;
      border-bottom: 1px solid #333333;
      margin-bottom: 25px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: #888888;
      margin-bottom: 6px;
    }

    .logo-title {
      font-size: 2.3rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* 검색 및 필터 컨트롤 */
    .filter-card {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .filter-input {
      flex: 1;
      background-color: #121212;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .filter-input:focus {
      border-color: #ff6b81;
    }

    /* 2. 장르 탭 (기타 문화 탭 포함) */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      background-color: #1e1e1e;
      color: #888888;
      border: 1px solid #333333;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background-color: #ff6b81;
      color: #ffffff;
      border-color: #ff6b81;
    }

    /* 3. 레이아웃: 왼쪽(전시 목록), 오른쪽(네이버 지도) */
    .main-content {
      display: flex;
      gap: 24px;
    }

    .event-list-area {
      flex: 1;
    }

    .map-area {
      flex: 1;
      position: sticky;
      top: 20px;
      height: 700px;
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .map-header {
      padding: 14px 20px;
      background-color: #252525;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ff8fa3;
      border-bottom: 1px solid #333333;
    }

    .map-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 리스트 및 카드 스타일 */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .event-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .event-card:hover {
      transform: translateY(-2px);
      border-color: #ff6b81;
    }

    .badge-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-art { background-color: #ff6b81; color: #ffffff; }
    .badge-music { background-color: #3f51b5; color: #ffffff; }
    .badge-theater { background-color: #9c27b0; color: #ffffff; }
    .badge-etc { background-color: #555555; color: #ffffff; }

    .facility-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .event-title {
      font-size: 0.98rem;
      color: #cccccc;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .event-date {
      font-size: 0.85rem;
      color: #888888;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      color: #888888;
      font-size: 1rem;
    }

    @media (max-width: 900px) {
      .main-content {
        flex-direction: column;
      }
      .map-area {
        height: 400px;
        position: static;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 -->
    <header>
      <div class="header-subtitle">서울 전시, 문화 정보</div>
      <h1 class="logo-title">아트하트❤️</h1>
    </header>

    <!-- 검색 바 -->
    <div class="filter-card">
      <input type="text" id="search-input" class="filter-input" placeholder="전시장/공연명 검색..." oninput="filterData()">
    </div>

    <!-- 장르 탭 (기타 문화 포함) -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="setTab('전체', this)">전체보기</button>
      <button class="tab-btn" onclick="setTab('미술', this)">🎨 미술/전시</button>
      <button class="tab-btn" onclick="setTab('음악', this)">🎼 음악/연주회</button>
      <button class="tab-btn" onclick="setTab('연극', this)">🎭 연극/뮤지컬</button>
      <button class="tab-btn" onclick="setTab('기타 문화', this)">🏛️ 기타 문화</button>
    </div>

    <!-- 메인 콘텐츠 (왼쪽: 리스트 / 오른쪽: 네이버 지도) -->
    <div class="main-content">
      <!-- 왼쪽: 전시 정보 목록 -->
      <div class="event-list-area">
        <div id="event-list" class="event-list">
          <div class="loading">실시간 정보 데이터를 불러오는 중입니다...</div>
        </div>
      </div>

      <!-- 오른쪽: 기존 네이버 지도 연동 영역 -->
      <div class="map-area">
        <div id="map-header" class="map-header">🗺️ 네이버 지도 (목록을 선택하세요)</div>
        <iframe id="map-frame" class="map-frame" src="https://m.map.naver.com/search2/search.naver?query=서울 미술관"></iframe>
      </div>
    </div>
  </div>

  <script>
    const KOPIS_API_KEY = "4650ca9b3cd14d5eb489f753faf9d070";

    let apiData = [];
    let currentTab = "전체";

    /**
     * API 실제 데이터만 수집 (가짜 데이터 없음)
     */
    async function loadApiData() {
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const targetUrl = `https://www.kopis.or.kr/openApi/rest/pblprfr?service=${KOPIS_API_KEY}&stdate=${today}&eddate=20261231&cpage=1&rows=100&prfstate=02`;

      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
        if (res.ok) {
          const json = await res.json();
          if (json.contents) {
            parseXml(json.contents);
            return;
          }
        }
        throw new Error("Data fetch error");
      } catch (err) {
        document.getElementById("event-list").innerHTML = 
          `<div class="loading">데이터를 불러올 수 없습니다. 네트워크 연결을 확인해주세요.</div>`;
      }
    }

    /**
     * XML 데이터 해석 및 장르 분류
     */
    function parseXml(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const items = Array.from(xmlDoc.getElementsByTagName("db"));

      apiData = items.map(item => {
        const genreText = item.getElementsByTagName("genrenm")[0]?.textContent || "";
        
        return {
          id: item.getElementsByTagName("mt20")[0]?.textContent || "",
          title: item.getElementsByTagName("prfnm")[0]?.textContent || "",
          facility: item.getElementsByTagName("fcltynm")[0]?.textContent || "",
          genre: getGenreCategory(genreText),
          startDate: item.getElementsByTagName("prfpdfrom")[0]?.textContent || "",
          endDate: item.getElementsByTagName("prfpdto")[0]?.textContent || ""
        };
      });

      filterData();
    }

    /**
     * 장르 파싱 (미술, 음악, 연극 이외 -> '기타 문화')
     */
    function getGenreCategory(genreStr) {
      if (genreStr.includes("미술") || genreStr.includes("전시")) return "미술";
      if (genreStr.includes("음악") || genreStr.includes("국악") || genreStr.includes("클래식")) return "음악";
      if (genreStr.includes("연극") || genreStr.includes("뮤지컬") || genreStr.includes("무용")) return "연극";
      return "기타 문화";
    }

    /**
     * 탭 전환
     */
    function setTab(tabName, btn) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterData();
    }

    /**
     * 필터링 적용
     */
    function filterData() {
      const searchKeyword = document.getElementById("search-input").value.toLowerCase();

      const filtered = apiData.filter(item => {
        const tabMatch = (currentTab === "전체") || (item.genre === currentTab);
        const searchMatch = item.title.toLowerCase().includes(searchKeyword) || 
                            item.facility.toLowerCase().includes(searchKeyword);
        return tabMatch && searchMatch;
      });

      renderList(filtered);
    }

    /**
     * 카드 클릭 시 네이버 지도 이동 및 연동
     */
    function onClickCard(facilityName, title) {
      const mapFrame = document.getElementById("map-frame");
      const mapHeader = document.getElementById("map-header");

      // 오른쪽 네이버 지도 뷰어 업데이트
      mapHeader.innerText = `🗺️ 네이버 지도: ${facilityName}`;
      mapFrame.src = `https://m.map.naver.com/search2/search.naver?query=${encodeURIComponent(facilityName)}`;

      // 기존 네이버 지도 길찾기/검색 새창 연결
      const openNaver = confirm(`[${facilityName}]\n"${title}"\n\n네이버 지도 앱/웹 검색으로 이동하시겠습니까?`);
      if (openNaver) {
        window.open(`https://map.naver.com/v5/search/${encodeURIComponent(facilityName)}`, '_blank');
      }
    }

    /**
     * 리스트 출력
     */
    function renderList(list) {
      const listContainer = document.getElementById("event-list");
      listContainer.innerHTML = "";

      if (list.length === 0) {
        listContainer.innerHTML = `<div class="loading">조회된 정보가 없습니다.</div>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "event-card";
        card.onclick = () => onClickCard(item.facility, item.title);

        let badgeStyle = "badge-art";
        if (item.genre === "음악") badgeStyle = "badge-music";
        if (item.genre === "연극") badgeStyle = "badge-theater";
        if (item.genre === "기타 문화") badgeStyle = "badge-etc";

        card.innerHTML = `
          <div class="badge-group">
            <span class="badge ${badgeStyle}">${item.genre}</span>
          </div>
          <h2 class="facility-name">${item.facility}</h2>
          <p class="event-title">${item.title}</p>
          <span class="event-date">🗓️ ${item.startDate} ~ ${item.endDate}</span>
        `;

        listContainer.appendChild(card);
      });
    }

    // 실행
    loadApiData();
  </script>
</body>
</html>
