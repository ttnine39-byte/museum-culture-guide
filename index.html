<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아트하트❤️ - 공연/전시 정보</title>
  <style>
    /* 기본 레이아웃 및 스타일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    /* 헤더 및 로고 타이틀 (조건 1: 아트하트❤️ 전체 흰색 글자) */
    header {
      text-align: left;
      padding: 20px 0 30px 0;
      border-bottom: 1px solid #333333;
      margin-bottom: 30px;
    }

    .logo-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff; /* 글자 전체 흰색 */
    }

    /* 메인 컨테이너 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 리스트 및 카드 스타일 (왼쪽에 글자 배치) */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-card {
      display: flex;
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2a2a2a;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-2px);
      border-color: #ff6b81;
    }

    /* 왼쪽 글자 정보 영역 */
    .event-info {
      flex: 1;
      text-align: left; /* 왼쪽 정렬 */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .badge-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-art {
      background-color: #ff6b81;
      color: #ffffff;
    }

    .badge-music {
      background-color: #333333;
      color: #aaa;
    }

    .badge-famous {
      background-color: #3a232e;
      color: #ff8fa3;
      border: 1px solid #ff6b81;
    }

    .facility-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .event-title {
      font-size: 1rem;
      color: #cccccc;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .event-date {
      font-size: 0.85rem;
      color: #888888;
    }

    /* 로딩 및 안내 메시지 */
    .loading {
      text-align: center;
      padding: 50px 0;
      color: #888888;
      font-size: 1.1rem;
    }

    .notice-bar {
      background-color: #2a1a1f;
      border: 1px solid #ff6b81;
      color: #ff8fa3;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 (아트하트❤️ 전체 흰색) -->
    <header>
      <h1 class="logo-title">아트하트❤️</h1>
    </header>

    <div id="notice-area"></div>

    <!-- 이벤트 리스트 영역 -->
    <main>
      <div id="event-list" class="event-list">
        <div class="loading">공연/전시 데이터를 불러오는 중입니다...</div>
      </div>
    </main>
  </div>

  <script>
    const KOPIS_API_KEY = "4650ca9b3cd14d5eb489f753faf9d070";

    // 유명/대형 미술관 및 주요 전시장 우선순위 리스트
    const FAMOUS_MUSEUMS = [
      "국립현대미술관",
      "서울시립미술관",
      "예술의전당",
      "세종문화회관",
      "리움미술관",
      "DDP",
      "동대문디자인플라자",
      "한가람미술관",
      "한가람디자인미술관",
      "경남도립미술관",
      "부산시립미술관",
      "대구미술관",
      "광주시립미술관",
      "전북도립미술관"
    ];

    // CORS 차단 발생 시 대체 표시될 백업 데이터 세트 (전시/미술 중심)
    const FALLBACK_DATA = [
      {
        id: "PF200001",
        title: "2026 현대미술 특별전: 빛과 공간의 울림",
        facility: "국립현대미술관 서울",
        genre: "미술",
        startDate: "2026.05.01",
        endDate: "2026.10.31"
      },
      {
        id: "PF200002",
        title: "거장들의 기획전: 르네상스에서 현대까지",
        facility: "서울시립미술관",
        genre: "미술",
        startDate: "2026.06.15",
        endDate: "2026.09.20"
      },
      {
        id: "PF200003",
        title: "한가람 미술 대축제 2026",
        facility: "예술의전당 한가람미술관",
        genre: "미술",
        startDate: "2026.07.01",
        endDate: "2026.12.31"
      },
      {
        id: "PF200004",
        title: "미디어 아웃사이드: 디지털 아트 에디션",
        facility: "DDP 동대문디자인플라자",
        genre: "전시",
        startDate: "2026.04.10",
        endDate: "2026.08.30"
      },
      {
        id: "PF200005",
        title: "한국 현대 미학 컬렉션",
        facility: "리움미술관",
        genre: "미술",
        startDate: "2026.05.20",
        endDate: "2026.11.15"
      },
      {
        id: "PF200006",
        title: "여름 교향악 축제 오케스트라",
        facility: "세종문화회관",
        genre: "음악/연주회",
        startDate: "2026.08.01",
        endDate: "2026.08.15"
      }
    ];

    /**
     * API 호출 및 예외 처리
     */
    async function loadEvents() {
      const today = new Date();
      const stdate = today.toISOString().slice(0, 10).replace(/-/g, "");
      const eddate = "20261231";
      
      const targetUrl = `https://www.kopis.or.kr/openApi/rest/pblprfr?service=${KOPIS_API_KEY}&stdate=${stdate}&eddate=${eddate}&cpage=1&rows=100&prfstate=02`;

      // API 테스트 (CORS 허용 브라우저/서버 환경)
      try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
        
        if (!response.ok) throw new Error("네트워크 응답 오류");
        
        const data = await response.json();
        
        if (data.contents && data.contents.includes("<db>")) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(data.contents, "text/xml");
          const items = Array.from(xmlDoc.getElementsByTagName("db"));

          const eventList = items.map(item => ({
            id: item.getElementsByTagName("mt20")[0]?.textContent || "",
            title: item.getElementsByTagName("prfnm")[0]?.textContent || "",
            facility: item.getElementsByTagName("fcltynm")[0]?.textContent || "",
            genre: item.getElementsByTagName("genrenm")[0]?.textContent || "",
            startDate: item.getElementsByTagName("prfpdfrom")[0]?.textContent || "",
            endDate: item.getElementsByTagName("prfpdto")[0]?.textContent || ""
          }));

          processAndRender(eventList);
          return;
        }
        throw new Error("정상 XML 데이터를 가져오지 못함");
      } catch (err) {
        console.warn("CORS/네트워크 차단으로 백업 데이터 모드로 전환됩니다.", err);
        
        // 브라우저 직접 실행(file://) 등 CORS 차단 시 백업 데이터로 즉시 화면 표시
        showNotice("💡 KOPIS API 브라우저 보안 차단(CORS) 정책으로 인해 샘플 데이터 목록을 표시합니다.");
        processAndRender(FALLBACK_DATA);
      }
    }

    /**
     * 안내 메시지 바 표시
     */
    function showNotice(msg) {
      const noticeArea = document.getElementById("notice-area");
      noticeArea.innerHTML = `<div class="notice-bar">${msg}</div>`;
    }

    /**
     * 정렬 처리 및 렌더링
     */
    function processAndRender(events) {
      const sortedList = sortEvents(events);
      renderList(sortedList);
    }

    /**
     * 미술/전시 우선 + 주요 미술관 최상단 정렬 함수
     */
    function sortEvents(events) {
      return events.sort((a, b) => {
        const isArtA = isArtGenre(a.genre);
        const isArtB = isArtGenre(b.genre);

        // 1. 미술/전시 우선
        if (isArtA && !isArtB) return -1;
        if (!isArtA && isArtB) return 1;

        // 2. 주요 미술관 최상단 배치
        const famousIndexA = getFamousIndex(a.facility);
        const famousIndexB = getFamousIndex(b.facility);

        if (famousIndexA !== -1 && famousIndexB !== -1) {
          return famousIndexA - famousIndexB;
        }
        if (famousIndexA !== -1) return -1;
        if (famousIndexB !== -1) return 1;

        return a.facility.localeCompare(b.facility);
      });
    }

    function isArtGenre(genre) {
      const artKeywords = ["미술", "전시", "복합", "서커스/마술"];
      return artKeywords.some(keyword => genre.includes(keyword));
    }

    function getFamousIndex(facilityName) {
      return FAMOUS_MUSEUMS.findIndex(museum => facilityName.includes(museum));
    }

    /**
     * 화면 렌더링 함수
     */
    function renderList(events) {
      const container = document.getElementById("event-list");
      container.innerHTML = "";

      if (events.length === 0) {
        container.innerHTML = `<div class="loading">조회된 정보가 없습니다.</div>`;
        return;
      }

      events.forEach(event => {
        const isArt = isArtGenre(event.genre);
        const isFamous = getFamousIndex(event.facility) !== -1;

        const card = document.createElement("div");
        card.className = "event-card";
        
        card.innerHTML = `
          <div class="event-info">
            <div class="badge-group">
              <span class="badge ${isArt ? 'badge-art' : 'badge-music'}">${event.genre}</span>
              ${isFamous ? '<span class="badge badge-famous">주요 미술관/전시관</span>' : ''}
            </div>
            <h2 class="facility-name">${event.facility}</h2>
            <p class="event-title">${event.title}</p>
            <span class="event-date">${event.startDate} ~ ${event.endDate}</span>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // 앱 실행
    loadEvents();
  </script>
</body>
</html>
