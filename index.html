<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아트하트 - 공연/전시 정보</title>
  <style>
    /* 기본 레이아웃 및 스타일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }

    /* 헤더 및 로고 타이틀 (조건 2: 아트-흰색, 하트-분홍색) */
    header {
      text-align: left;
      padding: 20px 0 30px 0;
      border-bottom: 1px solid #333333;
      margin-bottom: 30px;
    }

    .logo-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .text-white {
      color: #ffffff; /* '아트': 흰색 */
    }

    .text-pink {
      color: #ff6b81; /* '하트': 분홍색 */
    }

    /* 메인 컨테이너 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 리스트 및 카드 스타일 (조건 4: 왼쪽에 글자 배치) */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-card {
      display: flex;
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2a2a2a;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-2px);
      border-color: #ff6b81;
    }

    /* 왼쪽 글자 정보 영역 */
    .event-info {
      flex: 1;
      text-align: left; /* 왼쪽 정렬 강제 */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .badge-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-art {
      background-color: #ff6b81;
      color: #ffffff;
    }

    .badge-music {
      background-color: #333333;
      color: #aaa;
    }

    .badge-famous {
      background-color: #3a232e;
      color: #ff8fa3;
      border: 1px solid #ff6b81;
    }

    .facility-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .event-title {
      font-size: 1rem;
      color: #cccccc;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .event-date {
      font-size: 0.85rem;
      color: #888888;
    }

    /* 로딩 상태 표시 */
    .loading {
      text-align: center;
      padding: 50px 0;
      color: #888888;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <header>
      <h1 class="logo-title">
        <span class="text-white">아트</span><span class="text-pink">하트</span>
      </h1>
    </header>

    <!-- 이벤트 리스트 영역 -->
    <main>
      <div id="event-list" class="event-list">
        <div class="loading">KOPIS 데이터를 불러오는 중입니다...</div>
      </div>
    </main>
  </div>

  <script>
    // 1. KOPIS API 키 (조건 1)
    const KOPIS_API_KEY = "4650ca9b3cd14d5eb489f753faf9d070";

    // 유명/대형 미술관 및 주요 전시장 우선순위 리스트 (조건 4)
    const FAMOUS_MUSEUMS = [
      "국립현대미술관",
      "서울시립미술관",
      "예술의전당",
      "세종문화회관",
      "리움미술관",
      "DDP",
      "동대문디자인플라자",
      "한가람미술관",
      "한가람디자인미술관",
      "경남도립미술관",
      "부산시립미술관",
      "대구미술관",
      "광주시립미술관",
      "전북도립미술관"
    ];

    /**
     * KOPIS API 데이터 연동 함수
     */
    async function fetchArtEvents() {
  const today = new Date();
  const stdate = today.toISOString().slice(0, 10).replace(/-/g, "");
  const eddate = "20261231";

  // KOPIS 원본 API URL
  const targetUrl = `https://www.kopis.or.kr/openApi/rest/pblprfr?service=${KOPIS_API_KEY}&stdate=${stdate}&eddate=${eddate}&cpage=1&rows=100&prfstate=02`;

  // corsproxy.io 우회 서비스 적용
  const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

  try {
    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error("API 요청 실패");
    
    const xmlText = await response.text();
    
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    const items = Array.from(xmlDoc.getElementsByTagName("db"));

    const eventList = items.map(item => ({
      id: item.getElementsByTagName("mt20")[0]?.textContent || "",
      title: item.getElementsByTagName("prfnm")[0]?.textContent || "",
      facility: item.getElementsByTagName("fcltynm")[0]?.textContent || "",
      genre: item.getElementsByTagName("genrenm")[0]?.textContent || "",
      startDate: item.getElementsByTagName("prfpdfrom")[0]?.textContent || "",
      endDate: item.getElementsByTagName("prfpdto")[0]?.textContent || "",
      poster: item.getElementsByTagName("poster")[0]?.textContent || ""
    }));

    const sortedList = sortEvents(eventList);
    renderList(sortedList);

  } catch (error) {
    console.error("KOPIS API 호출 실패:", error);
    document.getElementById("event-list").innerHTML = 
      `<div class="loading">데이터를 불러오는 데 실패했습니다. 다시 시도해 주세요.</div>`;
  }
}
    /**
     * 조건 3 & 4: 미술/전시 우선 + 유명 미술관 최상단 정렬 함수
     */
    function sortEvents(events) {
      return events.sort((a, b) => {
        const isArtA = isArtGenre(a.genre);
        const isArtB = isArtGenre(b.genre);

        // 조건 3: 미술/전시가 우선, 음악/연주회는 후순위
        if (isArtA && !isArtB) return -1;
        if (!isArtA && isArtB) return 1;

        // 조건 4: 유명/대형 미술관 상단 나열
        const famousIndexA = getFamousIndex(a.facility);
        const famousIndexB = getFamousIndex(b.facility);

        if (famousIndexA !== -1 && famousIndexB !== -1) {
          return famousIndexA - famousIndexB; // 유명 목록 지정 순서대로
        }
        if (famousIndexA !== -1) return -1;
        if (famousIndexB !== -1) return 1;

        // 기타 기본 정렬 (시설명 순)
        return a.facility.localeCompare(b.facility);
      });
    }

    // 미술/전시 관련 장르 판별 보조 함수
    function isArtGenre(genre) {
      const artKeywords = ["미술", "전시", "복합", "서커스/마술"];
      return artKeywords.some(keyword => genre.includes(keyword));
    }

    // 유명 미술관 여부 및 인덱스 반환 함수
    function getFamousIndex(facilityName) {
      return FAMOUS_MUSEUMS.findIndex(museum => facilityName.includes(museum));
    }

    /**
     * 화면 렌더링 함수 (조건 4: 왼쪽에 글자 배치)
     */
    function renderList(events) {
      const container = document.getElementById("event-list");
      container.innerHTML = "";

      if (events.length === 0) {
        container.innerHTML = `<div class="loading">조회된 공연/전시 정보가 없습니다.</div>`;
        return;
      }

      events.forEach(event => {
        const isArt = isArtGenre(event.genre);
        const isFamous = getFamousIndex(event.facility) !== -1;

        const card = document.createElement("div");
        card.className = "event-card";
        
        card.innerHTML = `
          <div class="event-info">
            <div class="badge-group">
              <span class="badge ${isArt ? 'badge-art' : 'badge-music'}">${event.genre}</span>
              ${isFamous ? '<span class="badge badge-famous">주요 미술관/전시관</span>' : ''}
            </div>
            <h2 class="facility-name">${event.facility}</h2>
            <p class="event-title">${event.title}</p>
            <span class="event-date">${event.startDate} ~ ${event.endDate}</span>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // 앱 실행
    fetchArtEvents();
  </script>
</body>
</html>
